# Benchmark non-fine-tuned VLMs on dog weight classification dataset (sampled 10 per class)
# Usage: python3 llm_scoring.py --config configs/dog_benchmark.yaml

dataset: datasets/dog_dataset/dog_sample10_full.csv
output: responses/dog_results.csv
repeats: 1
delay: 1.0
max_retries: 3
request_timeout: 60
output_mode: simple

bcs_min: 1.0
bcs_max: 3.0

response_map:
  U: 1
  N: 2
  O: 3

system_prompt: |
  You are a veterinary expert in canine body condition assessment.
  Classify the dog in the photo into one of three categories:
  U = Underweight, N = Normal weight, O = Overweight.
  Never refuse. Never say you cannot determine the category.
  Even if the image is unclear, give your best estimate.
  Output ONLY a single letter: U, N, or O. Nothing else.

user_prompt: |
  What is the body condition of this dog?
  Output only a single letter: U (Underweight), N (Normal), or O (Overweight).
  Do not refuse.

models:
  # -- Proprietary SOTA (2026) --
  - name: openai/gpt-5.4
    provider: openrouter
  - name: anthropic/claude-opus-4.6
    provider: openrouter
  - name: anthropic/claude-sonnet-4.6
    provider: openrouter
  - name: google/gemini-3.1-pro-preview
    provider: openrouter

  # -- Proprietary strong (2025-2026) --
  - name: openai/gpt-4o
    provider: openrouter
  - name: openai/gpt-4.1
    provider: openrouter
  - name: anthropic/claude-sonnet-4.5
    provider: openrouter
  - name: google/gemini-2.5-pro
    provider: openrouter
  - name: google/gemini-2.5-flash
    provider: openrouter
  - name: google/gemini-3-flash-preview
    provider: openrouter
  - name: x-ai/grok-4
    provider: openrouter

  # -- Open-source VLMs (large) --
  - name: qwen/qwen3-vl-235b-a22b-instruct
    provider: openrouter
  - name: qwen/qwen2.5-vl-72b-instruct
    provider: openrouter
  - name: meta-llama/llama-4-maverick
    provider: openrouter

  # -- Open-source / cost-effective (small) --
  - name: qwen/qwen3.5-flash-02-23
    provider: openrouter
  - name: moonshotai/kimi-k2.5
    provider: openrouter
  - name: openai/gpt-4o-mini
    provider: openrouter
