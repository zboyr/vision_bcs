# Benchmark non-fine-tuned VLMs on cow BCS dataset (sampled 5 per level)
# Usage: python3 llm_scoring.py --config configs/cow_benchmark.yaml

dataset: datasets/cow_dataset/cow_sample5_full.csv
output: responses/cow_results.csv
repeats: 1
delay: 1.0
max_retries: 3
request_timeout: 60
output_mode: simple

bcs_min: 1.0
bcs_max: 5.0

system_prompt: |
  You are a veterinary expert in bovine Body Condition Scoring (BCS, 1-5 scale).
  Assess the cow in the photo. You MUST output EXACTLY one number from the following allowed values:
  1.0, 1.25, 1.75, 2.0, 2.25, 2.75, 3.0, 3.25, 3.75, 4.0, 4.25, 4.75, 5.0
  Never refuse. Never say you cannot determine the score. Even if the image is unclear, give your best estimate.
  Output ONLY the number, nothing else.

user_prompt: |
  What is the Body Condition Score (BCS) of this cow? You must give a score.
  Output only a single number from: 1.0, 1.25, 1.75, 2.0, 2.25, 2.75, 3.0, 3.25, 3.75, 4.0, 4.25, 4.75, 5.0
  Do not refuse.

models:
  # -- Proprietary SOTA (2026) --
  - name: openai/gpt-5.4
    provider: openrouter
  - name: anthropic/claude-opus-4.6
    provider: openrouter
  - name: anthropic/claude-sonnet-4.6
    provider: openrouter
  - name: google/gemini-3.1-pro-preview
    provider: openrouter

  # -- Proprietary strong (2025-2026) --
  - name: openai/gpt-4o
    provider: openrouter
  - name: openai/gpt-4.1
    provider: openrouter
  - name: anthropic/claude-sonnet-4.5
    provider: openrouter
  - name: google/gemini-2.5-pro
    provider: openrouter
  - name: google/gemini-2.5-flash
    provider: openrouter
  - name: google/gemini-3-flash-preview
    provider: openrouter
  - name: x-ai/grok-4
    provider: openrouter

  # -- Open-source VLMs (large) --
  - name: qwen/qwen3-vl-235b-a22b-instruct
    provider: openrouter
  - name: qwen/qwen2.5-vl-72b-instruct
    provider: openrouter
  - name: meta-llama/llama-4-maverick
    provider: openrouter

  # -- Open-source / cost-effective (small) --
  - name: qwen/qwen3.5-flash-02-23
    provider: openrouter
  - name: moonshotai/kimi-k2.5
    provider: openrouter
  - name: openai/gpt-4o-mini
    provider: openrouter
