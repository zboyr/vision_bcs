# Local Qwen3-VL-4B (non-fine-tuned) on essay cat BCS dataset
# Usage: python3 llm_scoring.py --config configs/local_qwen4b_essay.yaml

dataset: datasets/essay/dataset_full.csv
output: responses/essay_results.csv
repeats: 3
delay: 0.5
max_retries: 3
request_timeout: 120
output_mode: simple

models:
  - name: Qwen/Qwen3-VL-4B-Instruct
    provider: local
    base_url: http://127.0.0.1:8000/v1
