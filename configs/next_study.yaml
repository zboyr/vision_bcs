# 7 Models x 7 Prompts BCS Scoring Experiment
# Usage:
#   python run_experiment.py --config configs/next_study.yaml
#   python run_experiment.py --config configs/next_study.yaml --model M1
#   python run_experiment.py --config configs/next_study.yaml --prompt P1

dataset: cat_data/essay/dataset_full.csv
output_dir: responses/next_study
repeats: 3
delay: 1.0
max_retries: 3
request_timeout: 60
concurrency: 10                        # parallel API calls per run

# P6 Visual Few-Shot reference image(s) — BCS reference charts
p6_reference_images:
  - prompts/cat_bcs.jpg
  - prompts/dog_bcs.jpg

models:
  M1:
    name: Qwen/Qwen2.5-VL-3B-Instruct
    provider: local
    base_url: http://127.0.0.1:8000/v1
  M2:
    name: Qwen/Qwen2.5-VL-3B-Instruct-BCS-LoRA
    provider: local
    base_url: http://127.0.0.1:8000/v1
  M3:
    name: google/gemma-3-4b-it
    provider: local
    base_url: http://127.0.0.1:8000/v1
  M4:
    name: google/gemma-3-4b-it-BCS-LoRA
    provider: local
    base_url: http://127.0.0.1:8000/v1
  M5:
    name: google/gemini-3.1-pro-preview
    provider: openrouter
  M6:
    name: google/gemini-3.1-flash-image-preview
    provider: openrouter
  M7:
    name: openai/gpt-5.4
    provider: openrouter

prompts:
  - P1   # Direct Integer
  - P2   # JSON Mode
  - P3   # Reasoning Mode
  - P4   # Best-of-5
  - P5   # Agent-as-a-Verifier v1
  - P6   # Visual Few-Shot
  - P7   # Debate v1
