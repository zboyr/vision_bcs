# 7 Models x 7 Prompts BCS Scoring Experiment
# Usage:
#   python run_experiment.py --config configs/next_study.yaml
#   python run_experiment.py --config configs/next_study.yaml --model M1
#   python run_experiment.py --config configs/next_study.yaml --prompt P1

dataset: datasets/cat_10k/eval.csv
output_dir: responses/next_study
repeats: 1
delay: 0.5
max_retries: 3
request_timeout: 120
concurrency: 5                         # parallel API calls per run

# P6 Visual Few-Shot reference image(s) — BCS reference charts
p6_reference_images:
  - prompts/cat_bcs.jpg
  - prompts/dog_bcs.jpg

# Local models: provider=transformers loads model in-process.
# base_url = HF model id, api_key = adapter path (or omit for base).
models:
  M1:
    name: Qwen/Qwen2.5-VL-3B-Instruct
    provider: transformers
    base_url: Qwen/Qwen2.5-VL-3B-Instruct
  M2:
    name: Qwen/Qwen2.5-VL-3B-Instruct-BCS-LoRA
    provider: transformers
    base_url: Qwen/Qwen2.5-VL-3B-Instruct
    api_key: outputs/qwen2_5_vl_3b_lora_bcs_0409_2019/epoch_3
  M3:
    name: google/gemma-4-E2B-it
    provider: transformers
    base_url: google/gemma-4-E2B-it
  M4:
    name: google/gemma-4-E2B-it-BCS-LoRA
    provider: transformers
    base_url: google/gemma-4-E2B-it
    api_key: outputs/gemma4_e2b_lora_bcs_0412_1044/epoch_1
  M5:
    name: google/gemini-3.1-pro-preview
    provider: openrouter
  M6:
    name: google/gemini-3.1-flash-image-preview
    provider: openrouter
  M7:
    name: openai/gpt-5.4
    provider: openrouter

prompts:
  - P1   # Direct Integer
  - P2   # JSON Mode
  - P3   # Reasoning Mode
  - P4   # Best-of-5
  - P5   # Agent-as-a-Verifier v1
  - P6   # Visual Few-Shot
  - P7   # Debate v1
