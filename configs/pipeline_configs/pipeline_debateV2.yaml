# Pipeline: Debate V2
# Stage 1 makes an initial score, stage 2 argues against it, stage 3 defends, stage 4 debates, stage 5 final decision with image

dataset: datasets/essay/dataset_full.csv
output: responses/pipeline.csv
repeats: 1
delay: 0.5
max_retries: 3
request_timeout: 180
output_mode: simple
run_prefix: debate_v2
show_detailed_results: true

models:
  - name: qwen/qwen2.5-vl-72b-instruct
    provider: openrouter
    use_pipeline: true
  - name: qwen/qwen3-vl-235b-a22b-instruct
    provider: openrouter
    use_pipeline: true
  - name: openai/gpt-4o
    provider: openrouter
    use_pipeline: true
  - name: google/gemini-3.1-pro-preview
    provider: openrouter
    use_pipeline: true

system_prompt: |
  You are a veterinary expert in feline Body Condition Scoring (BCS).

  The BCS scale is as follows:

  BCS 1: Ribs, spine, pelvis all easily visible. No fat. Severe muscle wasting.
  BCS 2: Ribs and spine visible. Minimal fat cover. Noticeable muscle loss.
  BCS 3: Ribs visible. Slight fat covering. Narrow waist. Minimal belly fat.
  BCS 4: Ribs palpable with minimal fat. Waist visible from above. Slight abdominal tuck. Slightly lean.
  BCS 5: Ribs palpable without excess fat. Clear waist from above. Slight abdominal tuck. IDEAL weight.
  BCS 6: Ribs palpable with slight excess fat. Waist visible but not prominent. Slight belly rounding.
  BCS 7: Ribs hard to feel under fat. Waist barely visible. Obvious abdominal rounding. Fat deposits on back.
  BCS 8: Ribs not palpable under heavy fat. No visible waist. Heavy abdominal fat pad. Fat on neck and limbs.
  BCS 9: Massive fat deposits everywhere. Ribs not palpable. Severely distended abdomen. No waist. Difficulty moving.

pipeline:
  total_stages: 5
  stage1:
    include_image: true
    prompt: |
      Score this animal's Body Condition. Use the full BCS 1–9 scale.
      Describe what you observe about ribs, waist, abdomen, and bony prominences.
      You must justify your score with specific visual features you see in the image for review.
      End with: INITIAL SCORE: <integer 1-9>
  stage2:
    include_image: true
    prompt: |
      You are now playing devil's advocate. Your colleague just gave the score above.
      Look at this animal again and argue for a DIFFERENT BCS score — either one higher or one lower.
      What visual features could support a different interpretation?
      You must justify your score with specific visual features you see in the image for review.
      End with: ALTERNATIVE SCORE: <integer 1-9>
  stage3:
    include_image: true
    prompt: |
      You are extremely opinionated about BCS scoring, and you are not afraid of using extreme
      scores if the evidence supports it.
      Now, ignore what your colleague said and score this animal's Body Condition yourself. 
      Use the full BCS 1–9 scale.
      Describe what you observe about ribs, waist, abdomen, and bony prominences.
      You must justify your score with specific visual features you see in the image for review.
      End with: OPINIONATED SCORE: <integer 1-9>
  stage4:
    prompt: |
      You now have three competing scores. Review all the arguments.
      Which assessment is better supported by the visual evidence described?
      Are there any features mentioned that you agree on?
      You must reason through the debate and come to a consensus on the most accurate score based on the evidence presented.
      Give your reasoned verdict, then end with: VERDICT SCORE: <integer 1-9>
  stage5:
    include_image: true
    prompt: |
      You have debated 4 scores. Look at this animal one final time with fresh eyes.
      Which verdict is correct based on what you actually see?
      Output ONLY a single integer from 1 to 9 as the final BCS score. No text!
